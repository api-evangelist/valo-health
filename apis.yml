aid: valo-health
name: Valo Health
description: 'Valo Health is a Boston-based drug discovery and development company that
  combines real-world human data, artificial intelligence, advanced causal inference and
  predictive chemistry to identify and validate therapeutic targets. Its work is organized
  around two stated capabilities: Human Causal Biology, which applies AI/ML and statistical
  genetics to large-scale human datasets and validates findings in human tissue, and
  Closed-Loop Chemistry, which pairs integrated computational modeling with laboratory
  work to engineer novel small molecules. The company, launched out of Flagship Pioneering
  and historically associated with its Opal Computational Platform, operates a shared
  risk-and-reward partnership model with pharmaceutical companies including Novo Nordisk,
  Merck KGaA, Pfizer and Lundbeck, advancing early-stage R&D while partners lead clinical
  development. Valo Health is a private biotechnology company that publishes no developer
  program, no public API and no machine-readable API contract.'
